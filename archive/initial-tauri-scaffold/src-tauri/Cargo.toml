[package]
name = "spacelens"
version = "0.1.0"
description = "A local-first Windows storage explorer"
edition = "2021"
rust-version = "1.80"

[lib]
name = "spacelens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.37"

[dev-dependencies]
tempfile = "3"
